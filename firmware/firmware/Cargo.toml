[package]
name = "firmware"
version = "0.1.0"
edition = "2024"

[workspace]

[[bin]]
name = "firmware"
test = false
bench = false

[dependencies]
robot-core = { path = "../robot-core" }
rticx-cortex-m = { version = "0.2.1", features = ["async"] }
rticx-async = "0.2"
rtic-monotonics = { version = "2", features = ["cortex-m-systick"] }
stm32f1xx-hal = { version = "0.11", features = ["stm32f103", "medium"] }
usb-device = "0.3"
usbd-serial = "0.2"
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
embedded-hal-02 = { package = "embedded-hal", version = "0.2.7", features = ["unproven"] }

[profile.release]
opt-level = "s"
debug = 2
lto = true
codegen-units = 1

[profile.dev]
opt-level = "s"
