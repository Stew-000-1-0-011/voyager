[project]
name = "carrier-mechanical"
version = "0.1.0"
description = "Carrier robot mechanical design (build123d)"
requires-python = ">=3.13"
dependencies = [
    "build123d==0.13.0",
    "cairosvg>=2.9.1",
    "pillow>=12.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
